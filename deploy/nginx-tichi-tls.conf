# Production vhost: the ONLY public listeners are 80 (ACME + redirect) and 443.
# Containers (db 5432, api 8080) are bound to 127.0.0.1 and reached only through this proxy.
limit_req_zone $binary_remote_addr zone=tichi_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tichikids.ir www.tichikids.ir;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://tichikids.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tichikids.ir;
    ssl_certificate     /etc/letsencrypt/live/tichikids.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tichikids.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /srv/tichi/web;
    index index.html;
    client_max_body_size 25m;
    server_tokens off;

    # login/register: network-level brake on top of the in-app throttle
    location /api/v1/auth/ { limit_req zone=tichi_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location /api/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location /audio/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /version.txt { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

# local-only listener used by the deploy smoke check
server {
    listen 127.0.0.1:8081;
    root /srv/tichi/web;
    location /api/ { proxy_pass http://127.0.0.1:8080; }
    location / { try_files $uri /index.html; }
}
