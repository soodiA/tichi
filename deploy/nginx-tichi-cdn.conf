# Production vhost behind the CDN: the CDN terminates TLS for tichikids.ir and fetches from this origin over
# plain HTTP on port 80. ufw allows port 80 ONLY from the CDN edge addresses (setup-cdn-origin.sh), so this
# is the only public listener. Containers (db 5432, api 8080) stay on 127.0.0.1.
# The CDN->origin hop is NOT encrypted: it does not protect against someone who can sniff that network path.
limit_req_zone $binary_remote_addr zone=tichi_auth:10m rate=10r/m;

# the CDN edges: trust their X-Forwarded-For so logs and rate limits see the real client, not the edge
set_real_ip_from 95.156.253.236;
set_real_ip_from 95.156.253.237;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# anything that is not our hostname (direct IP hits, other Host headers)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name tichikids.ir www.tichikids.ir;
    root /srv/tichi/web;
    index index.html;
    client_max_body_size 25m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/v1/auth/ { limit_req zone=tichi_auth burst=20 nodelay; proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location /api/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location /audio/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location = /healthz { proxy_pass http://127.0.0.1:8080; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /version.txt { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}

# local-only listener used by the deploy smoke check and the SSH-tunnel e2e
server {
    listen 127.0.0.1:8081;
    root /srv/tichi/web;
    client_max_body_size 25m;
    location /api/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location /audio/ { proxy_pass http://127.0.0.1:8080; include /etc/nginx/snippets/tichi-proxy.conf; }
    location / { try_files $uri /index.html; }
}
